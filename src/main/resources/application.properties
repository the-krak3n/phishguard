# ---------------------------------------------------------------
# PhishGuard configuration
# Every value can be overridden with an environment variable.
# ---------------------------------------------------------------
spring.application.name=phishguard

# Render / Railway give the port in the PORT variable; 8080 locally.
server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m

# Uploads (images and audio)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Lets Tomcat read an oversized upload so the user gets a clear "file too large" message
server.tomcat.max-swallow-size=30MB

# Gemini AI - leave GEMINI_API_KEY empty to run in offline rule-engine mode.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Tried automatically if the main model is unavailable for your API key
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.6-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}

# CSV scan history (HistoryManager)
app.history-file=${HISTORY_FILE:scan_history.csv}
